name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURSO_DATABASE_URL: https://test-db.turso.io
  TURSO_AUTH_TOKEN: test-token
  WORKOS_CLIENT_ID: client_test_dummy
  WORKOS_ISSUER: https://auth.example.test/user_management/client_test_dummy
  NEXT_PUBLIC_WORKOS_REDIRECT_URI: https://jsquaredadventures.com/callback
  WORKOS_COOKIE_PASSWORD: test-cookie-password-at-least-32-characters
  WORKOS_COOKIE_MAX_AGE: "1209600"
  ADMIN_ALLOWED_EMAILS: admin@example.com
  CLOUDINARY_CLOUD_NAME: test
  CLOUDINARY_API_KEY: test-key
  CLOUDINARY_API_SECRET: test-secret
  CRON_SECRET: test-cron-secret-min-16
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SENTRY_RELEASE: ${{ github.sha }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web run lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec tsc --noEmit

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web run test

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Blocking: production dependencies must have no high/critical advisory.
      - run: pnpm audit --prod --audit-level=high
      # Informative-only: devDependency tree advisories are tracked but do not
      # gate the release (pre-existing transitive vulns in test/build tooling).
      - run: pnpm audit --dev --audit-level=high
        continue-on-error: true
      # Equivalent to `gitleaks detect --no-git` via the official action.
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate migrations from schema
        working-directory: web
        env:
          TURSO_DATABASE_URL: file:${{ runner.temp }}/generate.db
        run: pnpm run db:generate
      - name: Fail if generated output is not committed
        run: |
          git diff --exit-code web/drizzle
          test -z "$(git status --porcelain web/drizzle)"
      - name: Apply migrations to a temporary database
        working-directory: web
        env:
          TURSO_DATABASE_URL: file:${{ runner.temp }}/migrate.db
        run: pnpm run db:migrate:node
      - name: Verify schema and migration ledger
        working-directory: web
        env:
          TURSO_DATABASE_URL: file:${{ runner.temp }}/migrate.db
        run: pnpm run db:verify

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web run build:node
      - name: Package standalone release
        working-directory: web
        run: node scripts/package-standalone.mjs /tmp/jsquared-blog-release
      - name: Verify WorkOS runtime dependencies resolve
        working-directory: /tmp/jsquared-blog-release/web
        run: |
          node --input-type=module -e 'for (const id of ["@workos-inc/authkit-nextjs", "@workos-inc/node"]) { const resolved = import.meta.resolve(id); if (!resolved.includes("node_modules")) throw new Error(`Unresolved ${id}`); console.info(`${id}: ${resolved}`); }'
      - name: Smoke anonymous AuthKit response headers
        working-directory: web
        run: pnpm run test:authkit-smoke /tmp/jsquared-blog-release

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # SPD-6: cache Playwright browser binaries so we stop downloading them
      # on every run. The version is part of the cache key so the cache busts
      # automatically when the pinned playwright version changes.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(pnpm --filter web exec playwright --version)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      # Heavy download + OS deps only when the browser cache missed.
      - name: Install Playwright browsers (no cache)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium
      # Cache hit: binaries already present, just ensure OS-level deps exist.
      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter web exec playwright install-deps chromium
      - run: pnpm --filter web run test:e2e
