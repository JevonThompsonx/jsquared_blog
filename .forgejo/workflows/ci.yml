# Generated by zLeafNinja/ci-workflows — do not hand-edit.
# Change the template there and re-run sync_ci.py; local edits are overwritten.
name: ci
# Runs on merge to the default branch only. Feature-branch pushes are covered
# by the local workflow; PR review is handled by PR-Agent. Every extra trigger
# multiplies runner load without proving anything new.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Forgejo does not implement top-level `permissions:`; including it only
# produces a "not supported ... will be ignored" warning.

concurrency:
  group: ci-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: pnpm · build
    runs-on: forgejo-ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: install
        run: pnpm install --no-frozen-lockfile
      - name: build
        run: pnpm run build
      - name: test
        continue-on-error: true
        run: pnpm run test
